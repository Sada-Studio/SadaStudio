name: Stage Echo Playground v11 fixed

on:
  push:
    branches:
      - deploy/echo-playground-v11

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy/echo-playground-v11
          fetch-depth: 0

      - name: Download and verify exact approved Sites build
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN="https://sada-echo-playground.bayak674.chatgpt.site"
          STAGE="$RUNNER_TEMP/echo-stage"
          CHECKSUM_B64=''
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          printf '%s' "$CHECKSUM_B64" | base64 -d > "$RUNNER_TEMP/echo-sha256.txt"
          while read -r hash path; do
            [ -n "${path:-}" ] || continue
            mkdir -p "$STAGE/$(dirname "$path")"
            curl --fail --location --retry 3 --retry-delay 2 --silent --show-error "$ORIGIN/$path" -o "$STAGE/$path"
          done < "$RUNNER_TEMP/echo-sha256.txt"
          (cd "$STAGE" && sha256sum -c "$RUNNER_TEMP/echo-sha256.txt")

      - name: Preserve production-only files and replace public site
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/echo-stage"
          for f in CNAME favicon.ico favicon.png googled28a6a1ac5a61018.html sada-share.png robots.txt .nojekyll; do
            if [ -f "$f" ]; then
              cp "$f" "$STAGE/$f"
            fi
          done
          rsync -a --delete --exclude='.git/' --exclude='.github/' "$STAGE/" ./
          rm -f .github/workflows/echo-playground-v11-stage.yml
          rm -f .github/workflows/echo-playground-v11-stage-fixed.yml

      - name: Commit staged production site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Sada-Studio"
          git config user.email "sadaagency2025@gmail.com"
          git add -A
          git commit -m "Stage approved Echo Playground v11 for production"
          git push origin HEAD:deploy/echo-playground-v11
