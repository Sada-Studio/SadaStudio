name: Build exact Echo Playground v11 staging branch

on:
  push:
    branches:
      - deploy/echo-playground-v11

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy/echo-playground-v11
          fetch-depth: 0

      - name: Assemble and verify exact uploaded production bundle
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://sada-echo-playground.bayak674.chatgpt.site'
          STAGE="$RUNNER_TEMP/echo-v11"
          HTML_B64="$RUNNER_TEMP/echo-html.b64"
          HTML_TAR="$RUNNER_TEMP/echo-html.tar.gz"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          while IFS= read -r path; do
            [ -n "$path" ] || continue
            mkdir -p "$STAGE/$(dirname "$path")"
            curl --fail --location --retry 3 --retry-delay 2 --silent --show-error \
              "$ORIGIN/$path" -o "$STAGE/$path"
          done < .deploy/echo-v11-nonhtml-paths.txt

          cat .deploy/html.part.* > "$HTML_B64"
          base64 -d "$HTML_B64" > "$HTML_TAR"
          printf '%s  %s\n' '1c746f26027bbe17a2716e963c073ad700a213feae10c7e3b0aa767ece3e638f' "$HTML_TAR" | sha256sum -c -
          tar -xzf "$HTML_TAR" -C "$STAGE"

          (cd "$STAGE" && sha256sum -c "$GITHUB_WORKSPACE/.deploy/echo-v11-sha256.txt")

          for f in CNAME favicon.ico favicon.png googled28a6a1ac5a61018.html sada-share.png robots.txt .nojekyll; do
            if [ -f "$f" ]; then
              cp "$f" "$STAGE/$f"
            fi
          done

          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='.deploy/' "$STAGE/" ./
          rm -rf .deploy
          rm -f .github/workflows/echo-playground-v11-stage.yml
          rm -f .github/workflows/echo-playground-v11-stage-fixed.yml
          rm -f .github/workflows/echo-v11-final-stage.yml

      - name: Commit verified staging tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Sada-Studio'
          git config user.email 'sadaagency2025@gmail.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Stage exact Sada Echo Playground v11 production bundle'
          git push origin HEAD:deploy/echo-playground-v11
