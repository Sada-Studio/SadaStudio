<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sada Studio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="icon" href="assets/icon.png" type="image/png" sizes="32x32">
</head>
<body>

    <!-- Preloader -->
    <div id="preloader">
        <img src="assets/loading_animation.gif" alt="Loading Animation" decoding="async">
    </div>

    <div id="dots-background"></div>

    <header class="main-header">
        <div class="container">
            <div class="logo">
                <a href="index.html"><img src="assets/web_logo.png" alt="Sada Studio Logo" fetchpriority="high"></a>
            </div>
            <button class="menu-toggle" aria-label="Toggle navigation">
                <div class="burger-lines">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <span class="menu-text">Menu</span>
            </button>
        </div>
    </header>

    <nav class="full-screen-nav">
        <button class="close-nav" aria-label="Close navigation">×</button>
        <ul>
            <li><a href="index.html" class="nav-link-item">Home</a></li>
            <li><a href="index.html#about" class="nav-link-item">About</a></li>
            <li><a href="#contact" class="nav-link-item">Contact</a></li>
        </ul>
    </nav>

    <main class="project-page-main">
        <div class="container">
            <div id="project-detail-container">
                <!-- This content will be dynamically populated by script.js -->
            </div>
        </div>
    </main>

    <!-- NEW UNIFIED FOOTER with Logo -->
    <footer id="contact" class="main-footer">
        <div class="container">
            <div class="footer-content-wrapper">
                <div class="footer-text-content">
                    <p class="footer-tagline">
                        ready to make an <span class="sonar-word"><strong>echo?</strong></span> lets talk
                    </p>
                    <a href="mailto:info@sadastudio.me" class="footer-email-link">info@sadastudio.me</a>
                    <div class="footer-social-links">
                        <a href="https://www.instagram.com/sadastudio.me?igsh=MW5oYWg1b2RnMzlwZQ==" target="_blank">Instagram</a>
                        <a href="https://wa.me/96103118825" target="_blank">WhatsApp</a>
                    </div>
                </div>
                <div class="footer-logo">
                    <img src="assets/footer_logo.png" alt="Sada Studio decorative logo" loading="lazy" decoding="async">
                </div>
            </div>
        </div>
    </footer>

    <div class="cursor" id="cursor-leader"></div>
    <div class="cursor cursor-trail"></div>
    <div class="cursor cursor-trail"></div>
    <div class="cursor cursor-trail"></div>
    <div class="cursor cursor-trail"></div>
    <div class="cursor cursor-trail"></div>
    <div class="cursor cursor-trail"></div>
    <div class="cursor cursor-trail"></div>
    <div class="cursor cursor-trail"></div>
    
    <script src="script.js"></script>
</body>
</html>
